[project]
name = "snowflake-to-databricks-migration"
version = "0.1.0"
description = "Snowflake to Databricks Migration Accelerator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "snowflake-connector-python>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 100
target-version = ['py310']
