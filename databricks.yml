bundle:
  name: snowflake-to-databricks-migration

workspace:
  host: ${var.databricks_host}

artifacts:
  default:
    type: whl
    path: .

resources:
  jobs:
    migration_pipeline:
      name: "Snowflake Migration Pipeline [${bundle.target}]"
      tasks:
        - task_key: extraction
          spark_python_task:
            python_file: src/extraction/snowflake_extractor.py
          job_cluster_key: migration_cluster

        - task_key: bronze_ingestion
          depends_on:
            - task_key: extraction
          spark_python_task:
            python_file: jobs/bronze/raw_to_bronze.py
          job_cluster_key: migration_cluster

        - task_key: silver_transformation
          depends_on:
            - task_key: bronze_ingestion
          spark_python_task:
            python_file: jobs/silver/bronze_to_silver.py
          job_cluster_key: migration_cluster

        - task_key: gold_processing
          depends_on:
            - task_key: silver_transformation
          spark_python_task:
            python_file: jobs/gold/silver_to_gold.py
          job_cluster_key: migration_cluster

      job_clusters:
        - job_cluster_key: migration_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            data_security_mode: USER_ISOLATION
            spark_conf:
              spark.databricks.delta.preview.enabled: "true"

targets:
  dev:
    mode: development
    variables:
      databricks_host: https://adb-dev.azuredatabricks.net
      environment: dev

  prod:
    mode: production
    variables:
      databricks_host: https://adb-prod.azuredatabricks.net
      environment: prod
